services:

  jenkins:
    build: ./controller

    container_name: jenkins

    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  registry:
    image: registry:2

    container_name: registry

    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - registry_data:/var/lib/registry

volumes:
  jenkins_home:
  registry_data: